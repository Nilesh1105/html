<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--Open a webpage-->
    <a href="https://www.facebook.com/">Facebook Login</a>

    <!--Open a webpage on a new tab-->
    <br>
    <br>
    <a href="https://www.facebook.com/" target="_main">Facebook Login</a>

    <!--Open a webpage with the help of image. Making the image clickable-->
    <br>
    <br>
    <a href="https://www.facebook.com/"><img
            src="https://img.magnific.com/premium-psd/facebook-logo-blue-circle_705838-12823.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Facebook Logo" height="100"></a>

    <!--Open a webpage with the help of image. Making the image clickable but this time we will open it on different tab-->
    <br>
    <br>
    <a href="https://www.facebook.com/" target="_main"><img
            src="https://img.magnific.com/premium-psd/facebook-logo-blue-circle_705838-12823.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Facebook Logo" height="100"></a>

    <!--div tag-->
    <!--It is also called as 'block' elemengt, it takes full width even if it is unnecessery-->
    <div>This is a div tag</div>

    <!--span tag-->
    <!--It is an 'inline' tag. It takes with which is necessery for it-->
    <span>This is a span tag</span>
</body>

</html>
